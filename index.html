<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Lern-Quiz</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f6f7fb;
      color: #1f2933;
    }
    body {
      margin: 0;
      padding: 32px 16px 48px;
      display: flex;
      justify-content: center;
    }
    .app {
      width: min(900px, 100%);
      background: #ffffff;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12);
    }
    header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
    }
    p {
      margin: 0;
      color: #52606d;
    }
    .topics {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0;
    }
    .topics button {
      border: 1px solid #d9e2ec;
      background: #f8fafc;
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
    }
    .topics button.active {
      background: #2563eb;
      color: white;
      border-color: transparent;
    }
    .card {
      display: grid;
      gap: 18px;
      grid-template-columns: minmax(0, 1fr);
      background: #f8fafc;
      padding: 18px;
      border-radius: 16px;
    }
    .chart {
      background: #0f172a;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      justify-content: center;
    }
    .question {
      font-size: 18px;
      font-weight: 600;
    }
    .answers {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .answers button {
      flex: 1 1 160px;
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    .answers button.correct {
      background: #16a34a;
      color: white;
    }
    .answers button.wrong {
      background: #dc2626;
      color: white;
    }
    .feedback {
      font-weight: 600;
      min-height: 24px;
    }
    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 14px;
      color: #52606d;
    }
    .next {
      background: #111827;
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    .hint {
      font-size: 14px;
      color: #52606d;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Trading Lern-Quiz</h1>
      <p>Wähle ein Thema und entscheide, ob die Aussage zum Chart stimmt.</p>
    </header>

    <div class="topics" id="topics"></div>

    <div class="card">
      <div class="chart" id="chart"></div>
      <div class="question" id="question"></div>
      <div class="answers">
        <button id="answer-true">Richtig</button>
        <button id="answer-false">Falsch</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="status">
        <div>
          Frage <span id="current">1</span>/<span id="total">1</span> · Punkte: <span id="score">0</span>
        </div>
        <button class="next" id="next">Nächste Frage</button>
      </div>
      <div class="hint">Tipp: Lade die Seite neu, wenn du neue Zufallsfragen willst.</div>
    </div>
  </div>

  <script>
    const charts = {
      bos: [
        {
          svg: `
          <svg width="420" height="200" viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
            <rect width="420" height="200" rx="12" fill="#0b1220"/>
            <g stroke="#1f2937" stroke-width="1">
              <line x1="20" y1="160" x2="400" y2="160"/>
              <line x1="20" y1="120" x2="400" y2="120"/>
              <line x1="20" y1="80" x2="400" y2="80"/>
              <line x1="20" y1="40" x2="400" y2="40"/>
            </g>
            <g>
              <rect x="40" y="110" width="14" height="40" fill="#ef4444"/>
              <rect x="70" y="90" width="14" height="60" fill="#22c55e"/>
              <rect x="100" y="95" width="14" height="45" fill="#ef4444"/>
              <rect x="130" y="70" width="14" height="75" fill="#22c55e"/>
              <rect x="160" y="60" width="14" height="85" fill="#22c55e"/>
              <rect x="190" y="50" width="14" height="95" fill="#22c55e"/>
              <rect x="220" y="40" width="14" height="105" fill="#22c55e"/>
              <rect x="250" y="35" width="14" height="110" fill="#22c55e"/>
              <rect x="280" y="30" width="14" height="115" fill="#22c55e"/>
              <rect x="310" y="70" width="14" height="75" fill="#ef4444"/>
              <rect x="340" y="40" width="14" height="105" fill="#22c55e"/>
              <rect x="370" y="25" width="14" height="120" fill="#22c55e"/>
            </g>
          </svg>`
        },
        {
          svg: `
          <svg width="420" height="200" viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
            <rect width="420" height="200" rx="12" fill="#0b1220"/>
            <g stroke="#1f2937" stroke-width="1">
              <line x1="20" y1="160" x2="400" y2="160"/>
              <line x1="20" y1="120" x2="400" y2="120"/>
              <line x1="20" y1="80" x2="400" y2="80"/>
              <line x1="20" y1="40" x2="400" y2="40"/>
            </g>
            <g>
              <rect x="40" y="60" width="14" height="85" fill="#22c55e"/>
              <rect x="70" y="55" width="14" height="90" fill="#22c55e"/>
              <rect x="100" y="65" width="14" height="80" fill="#ef4444"/>
              <rect x="130" y="50" width="14" height="95" fill="#22c55e"/>
              <rect x="160" y="40" width="14" height="105" fill="#22c55e"/>
              <rect x="190" y="70" width="14" height="75" fill="#ef4444"/>
              <rect x="220" y="80" width="14" height="65" fill="#ef4444"/>
              <rect x="250" y="90" width="14" height="55" fill="#ef4444"/>
              <rect x="280" y="100" width="14" height="45" fill="#ef4444"/>
              <rect x="310" y="110" width="14" height="35" fill="#ef4444"/>
              <rect x="340" y="120" width="14" height="25" fill="#ef4444"/>
            </g>
          </svg>`
        }
      ],
      choch: [
        {
          svg: `
          <svg width="420" height="200" viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
            <rect width="420" height="200" rx="12" fill="#0b1220"/>
            <g stroke="#1f2937" stroke-width="1">
              <line x1="20" y1="160" x2="400" y2="160"/>
              <line x1="20" y1="120" x2="400" y2="120"/>
              <line x1="20" y1="80" x2="400" y2="80"/>
              <line x1="20" y1="40" x2="400" y2="40"/>
            </g>
            <g>
              <rect x="40" y="120" width="14" height="35" fill="#ef4444"/>
              <rect x="70" y="110" width="14" height="45" fill="#ef4444"/>
              <rect x="100" y="90" width="14" height="65" fill="#ef4444"/>
              <rect x="130" y="80" width="14" height="75" fill="#ef4444"/>
              <rect x="160" y="70" width="14" height="85" fill="#ef4444"/>
              <rect x="190" y="60" width="14" height="95" fill="#ef4444"/>
              <rect x="220" y="50" width="14" height="105" fill="#22c55e"/>
              <rect x="250" y="40" width="14" height="115" fill="#22c55e"/>
              <rect x="280" y="30" width="14" height="125" fill="#22c55e"/>
              <rect x="310" y="20" width="14" height="135" fill="#22c55e"/>
            </g>
          </svg>`
        },
        {
          svg: `
          <svg width="420" height="200" viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
            <rect width="420" height="200" rx="12" fill="#0b1220"/>
            <g stroke="#1f2937" stroke-width="1">
              <line x1="20" y1="160" x2="400" y2="160"/>
              <line x1="20" y1="120" x2="400" y2="120"/>
              <line x1="20" y1="80" x2="400" y2="80"/>
              <line x1="20" y1="40" x2="400" y2="40"/>
            </g>
            <g>
              <rect x="40" y="40" width="14" height="115" fill="#22c55e"/>
              <rect x="70" y="50" width="14" height="105" fill="#22c55e"/>
              <rect x="100" y="55" width="14" height="100" fill="#22c55e"/>
              <rect x="130" y="70" width="14" height="85" fill="#ef4444"/>
              <rect x="160" y="85" width="14" height="70" fill="#ef4444"/>
              <rect x="190" y="95" width="14" height="60" fill="#ef4444"/>
              <rect x="220" y="110" width="14" height="45" fill="#ef4444"/>
              <rect x="250" y="120" width="14" height="35" fill="#ef4444"/>
              <rect x="280" y="130" width="14" height="25" fill="#ef4444"/>
            </g>
          </svg>`
        }
      ],
      trend: [
        {
          svg: `
          <svg width="420" height="200" viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
            <rect width="420" height="200" rx="12" fill="#0b1220"/>
            <g stroke="#1f2937" stroke-width="1">
              <line x1="20" y1="160" x2="400" y2="160"/>
              <line x1="20" y1="120" x2="400" y2="120"/>
              <line x1="20" y1="80" x2="400" y2="80"/>
              <line x1="20" y1="40" x2="400" y2="40"/>
            </g>
            <g>
              <rect x="40" y="110" width="14" height="45" fill="#22c55e"/>
              <rect x="70" y="100" width="14" height="55" fill="#22c55e"/>
              <rect x="100" y="90" width="14" height="65" fill="#22c55e"/>
              <rect x="130" y="80" width="14" height="75" fill="#22c55e"/>
              <rect x="160" y="70" width="14" height="85" fill="#22c55e"/>
              <rect x="190" y="60" width="14" height="95" fill="#22c55e"/>
              <rect x="220" y="50" width="14" height="105" fill="#22c55e"/>
              <rect x="250" y="40" width="14" height="115" fill="#22c55e"/>
              <rect x="280" y="30" width="14" height="125" fill="#22c55e"/>
            </g>
          </svg>`
        },
        {
          svg: `
          <svg width="420" height="200" viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
            <rect width="420" height="200" rx="12" fill="#0b1220"/>
            <g stroke="#1f2937" stroke-width="1">
              <line x1="20" y1="160" x2="400" y2="160"/>
              <line x1="20" y1="120" x2="400" y2="120"/>
              <line x1="20" y1="80" x2="400" y2="80"/>
              <line x1="20" y1="40" x2="400" y2="40"/>
            </g>
            <g>
              <rect x="40" y="40" width="14" height="115" fill="#ef4444"/>
              <rect x="70" y="50" width="14" height="105" fill="#ef4444"/>
              <rect x="100" y="60" width="14" height="95" fill="#ef4444"/>
              <rect x="130" y="70" width="14" height="85" fill="#ef4444"/>
              <rect x="160" y="80" width="14" height="75" fill="#ef4444"/>
              <rect x="190" y="90" width="14" height="65" fill="#ef4444"/>
              <rect x="220" y="100" width="14" height="55" fill="#ef4444"/>
              <rect x="250" y="110" width="14" height="45" fill="#ef4444"/>
              <rect x="280" y="120" width="14" height="35" fill="#ef4444"/>
            </g>
          </svg>`
        }
      ]
    };

    const quizData = {
      bos: [
        { text: "Dieser Chart zeigt einen Break of Structure (BOS) nach oben.", answer: true, chartIndex: 0 },
        { text: "Dieser Chart zeigt einen Break of Structure (BOS) nach oben.", answer: false, chartIndex: 1 }
      ],
      choch: [
        { text: "Hier siehst du einen Change of Character (CHoCH) nach oben.", answer: true, chartIndex: 0 },
        { text: "Hier siehst du einen Change of Character (CHoCH) nach oben.", answer: false, chartIndex: 1 }
      ],
      trend: [
        { text: "Der Chart zeigt einen klaren Aufwärtstrend.", answer: true, chartIndex: 0 },
        { text: "Der Chart zeigt einen klaren Aufwärtstrend.", answer: false, chartIndex: 1 }
      ]
    };

    const topics = [
      { key: "bos", label: "BOS erkennen" },
      { key: "choch", label: "CHoCH erkennen" },
      { key: "trend", label: "Trend erkennen" }
    ];

    const state = {
      topic: "bos",
      index: 0,
      score: 0,
      pool: []
    };

    const topicsContainer = document.getElementById("topics");
    const chartContainer = document.getElementById("chart");
    const questionEl = document.getElementById("question");
    const feedbackEl = document.getElementById("feedback");
    const currentEl = document.getElementById("current");
    const totalEl = document.getElementById("total");
    const scoreEl = document.getElementById("score");
    const nextButton = document.getElementById("next");
    const trueButton = document.getElementById("answer-true");
    const falseButton = document.getElementById("answer-false");

    function shuffle(array) {
      return array
        .map((value) => ({ value, sort: Math.random() }))
        .sort((a, b) => a.sort - b.sort)
        .map(({ value }) => value);
    }

    function setTopic(topicKey) {
      state.topic = topicKey;
      state.index = 0;
      state.score = 0;
      state.pool = shuffle([...quizData[topicKey]]);
      feedbackEl.textContent = "";
      scoreEl.textContent = state.score;
      updateButtons();
      render();
    }

    function renderTopics() {
      topicsContainer.innerHTML = "";
      topics.forEach((topic) => {
        const button = document.createElement("button");
        button.textContent = topic.label;
        button.classList.toggle("active", topic.key === state.topic);
        button.addEventListener("click", () => {
          setTopic(topic.key);
          renderTopics();
        });
        topicsContainer.appendChild(button);
      });
    }

    function render() {
      const question = state.pool[state.index];
      chartContainer.innerHTML = charts[state.topic][question.chartIndex].svg;
      questionEl.textContent = question.text;
      currentEl.textContent = state.index + 1;
      totalEl.textContent = state.pool.length;
      updateButtons();
    }

    function updateButtons() {
      trueButton.disabled = false;
      falseButton.disabled = false;
      trueButton.classList.remove("correct", "wrong");
      falseButton.classList.remove("correct", "wrong");
    }

    function handleAnswer(value) {
      const question = state.pool[state.index];
      const isCorrect = question.answer === value;
      if (isCorrect) {
        feedbackEl.textContent = "Richtig!";
        feedbackEl.style.color = "#16a34a";
        state.score += 1;
      } else {
        feedbackEl.textContent = "Leider falsch.";
        feedbackEl.style.color = "#dc2626";
      }
      scoreEl.textContent = state.score;
      trueButton.disabled = true;
      falseButton.disabled = true;
      if (value === true) {
        trueButton.classList.add(isCorrect ? "correct" : "wrong");
        falseButton.classList.add(isCorrect ? "wrong" : "correct");
      } else {
        falseButton.classList.add(isCorrect ? "correct" : "wrong");
        trueButton.classList.add(isCorrect ? "wrong" : "correct");
      }
    }

    function nextQuestion() {
      if (state.index < state.pool.length - 1) {
        state.index += 1;
      } else {
        state.index = 0;
        state.pool = shuffle([...quizData[state.topic]]);
      }
      feedbackEl.textContent = "";
      render();
    }

    trueButton.addEventListener("click", () => handleAnswer(true));
    falseButton.addEventListener("click", () => handleAnswer(false));
    nextButton.addEventListener("click", nextQuestion);

    setTopic("bos");
    renderTopics();
  </script>
</body>
</html>
